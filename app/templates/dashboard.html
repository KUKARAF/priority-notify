{% extends "base.html" %}
{% block title %}Dashboard — priority-notify{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Notifications</h1>
  <div class="filters">
    <button class="btn btn-primary" onclick="openAddNotification()">Add notification</button>
    <select id="filter-status" name="status"
            hx-get="/notifications/fragment"
            hx-target="#notification-list"
            hx-swap="innerHTML"
            hx-include="[name='priority']">
      <option value="">All statuses</option>
      <option value="unread" {% if filter_status == 'unread' %}selected{% endif %}>Unread</option>
      <option value="read" {% if filter_status == 'read' %}selected{% endif %}>Read</option>
      <option value="archived" {% if filter_status == 'archived' %}selected{% endif %}>Archived</option>
    </select>
    <select id="filter-priority" name="priority"
            hx-get="/notifications/fragment"
            hx-target="#notification-list"
            hx-swap="innerHTML"
            hx-include="[name='status']">
      <option value="">All priorities</option>
      <option value="critical" {% if filter_priority == 'critical' %}selected{% endif %}>Critical</option>
      <option value="high" {% if filter_priority == 'high' %}selected{% endif %}>High</option>
      <option value="medium" {% if filter_priority == 'medium' %}selected{% endif %}>Medium</option>
      <option value="low" {% if filter_priority == 'low' %}selected{% endif %}>Low</option>
    </select>
    <input type="search" id="search-input" class="search-input"
           placeholder="Search…" oninput="filterBySearch(this.value)">
  </div>
</div>

<div id="bulk-actions" class="bulk-actions" style="display:none">
  <span id="bulk-count" class="bulk-count">0 selected</span>
  <button class="btn btn-small" onclick="bulkMarkRead()">Read marked</button>
  <button class="btn btn-small btn-danger" onclick="bulkDelete()">Delete marked</button>
  <button class="btn btn-small btn-ghost" onclick="selectAll()">Select all visible</button>
  <button class="btn btn-small btn-ghost" onclick="clearSelection()">Clear</button>
</div>

<div id="notification-list" class="notification-list"
     hx-get="/notifications/fragment"
     hx-trigger="load"
     hx-swap="innerHTML"
     hx-include="[name='status'],[name='priority']">
</div>

<div id="add-notification-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAddNotification()">
  <div class="modal">
    <div class="modal-header">
      <h2>Add notification</h2>
      <button class="btn btn-ghost btn-small" onclick="closeAddNotification()">&times;</button>
    </div>
    <form onsubmit="return submitNotification(event)">
      <div class="form-group">
        <label for="notif-title">Title</label>
        <input type="text" id="notif-title" required maxlength="500">
      </div>
      <div class="form-group">
        <label for="notif-message">Message</label>
        <textarea id="notif-message" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="notif-priority">Priority</label>
          <select id="notif-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="form-group">
          <label for="notif-source">Source</label>
          <input type="text" id="notif-source" maxlength="255" placeholder="Optional">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeAddNotification()">Cancel</button>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/app.js"></script>
<script>
  initSSE();

  document.getElementById('notification-list').addEventListener('change', (e) => {
    if (e.target.classList.contains('notif-checkbox')) updateBulkBar();
  });

  document.body.addEventListener('htmx:afterSwap', (e) => {
    if (e.detail.target.id === 'notification-list') {
      updateBulkBar();
      const status = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const params = new URLSearchParams();
      if (status) params.set('status', status);
      if (priority) params.set('priority', priority);
      history.pushState({}, '', '/?' + params.toString());
    }
  });
</script>
{% endblock %}
